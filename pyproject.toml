[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dingtalkbridge"
version = "0.6.1"
description = "Local, read-only DingTalk archive and dependency-free MCP stdio bridge"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
attachments = ["Pillow>=10", "pypdf>=5", "pypdfium2>=4", "python-docx>=1.2", "python-pptx>=1", "openpyxl>=3.1", "xlrd>=2"]

[tool.setuptools.package-data]
dingtalkbridge = ["*.ps1"]

[project.scripts]
dingtalkbridge = "dingtalkbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/dingtalkbridge/native" = ["native/DingTalkUia.cs"]
"share/dingtalkbridge/ocr" = ["experimental/ocr/Capture-Ocr.ps1", "experimental/ocr/LocalOcr.ps1", "experimental/ocr/SafeWindowCrop.cs"]
